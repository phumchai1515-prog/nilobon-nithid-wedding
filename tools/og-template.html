<!DOCTYPE html>
<!-- Source for assets/og.jpg (link preview). Render at 1200x630:
     Chrome --headless=new --window-size=1200,630 --screenshot=og.png tools/og-template.html -->
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Prompt:wght@300&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: flex; background: #3E0B18; font-family: 'Prompt', sans-serif; }
  .photo { width: 470px; height: 630px; position: relative; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; }
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(62,11,24,0) 70%, #3E0B18 100%); }
  .panel {
    flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(ellipse at 50% 40%, #5A1224 0%, #3E0B18 70%);
    color: #F6F1E8; text-align: center;
  }
  .panel::before { content: ''; position: absolute; inset: 26px; border: 1px solid rgba(185,154,91,.45); }
  .panel::after { content: ''; position: absolute; inset: 33px; border: 1px solid rgba(185,154,91,.2); }
  .eyebrow { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 20px; letter-spacing: .42em; color: #B99A5B; }
  .mono { width: 250px; margin: 2px 0 -4px; }
  .names { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 62px; line-height: 1; color: #EAD9B6; }
  .names em { font-size: 44px; color: #B99A5B; padding: 0 8px; }
  .th { font-family: 'Charm', cursive; font-weight: 700; font-size: 38px; line-height: 1.2; color: #D8C3A5; margin-top: 8px; }
  .date { display: flex; align-items: center; gap: 16px; margin-top: 6px; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 24px; letter-spacing: .3em; color: #B99A5B; }
  .date::before, .date::after { content: ''; width: 46px; height: 1px; background: rgba(185,154,91,.7); }
  .venue { font-size: 20px; font-weight: 300; color: #EADFD2; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="photo"><img src="../assets/p104.jpg" alt=""></div>
  <div class="panel">
    <div class="eyebrow">THE WEDDING OF</div>
    <img class="mono" src="../assets/monogram-gold.png" alt="">
    <div class="names">Nilobon <em>&amp;</em> Nithid</div>
    <div class="th">นิโลบล &amp; นิธิศ</div>
    <div class="date">07 · 11 · 2026</div>
    <div class="venue">โรงแรมเดอ ปริ้นเซส อุดรธานี</div>
  </div>
</body>
</html>
